<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peminjaman - Test API</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
body { background: #f5f7fa; padding: 20px; color: #333; }
h1 { font-size: 22px; margin-bottom: 20px; }
.nav { background: #2c3e50; padding: 12px 20px; border-radius: 8px; margin-bottom: 24px; display: flex; gap: 16px; }
.nav a { color: #fff; text-decoration: none; font-weight: 500; padding: 4px 0; border-bottom: 2px solid transparent; }
.nav a:hover { border-color: #fff; }
.card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.row { display: flex; gap: 20px; }
.col { flex: 1; }
label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
button { background: #2c3e50; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
button:hover { background: #34495e; }
.result-box { margin-top: 12px; padding: 12px; border-radius: 6px; font-weight: 500; }
.sukses { background: #e8f5e9; color: #2e7d32; }
.error { background: #ffebee; color: #c62828; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #f8f9fa; font-weight: 600; color: #555; }
tr:hover { background: #f8f9fa; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.badge-green { background: #e8f5e9; color: #2e7d32; }
.badge-blue { background: #e3f2fd; color: #1565c0; }
.badge-red { background: #ffebee; color: #c62828; }
.loading { text-align: center; padding: 20px; color: #888; }
</style>
</head>
<body>

<div class="nav">
  <a href="index.html">&#128218; Buku</a>
  <a href="pinjam.html">&#128230; Peminjaman</a>
  <a href="denda.html">&#128176; Denda</a>
  <a href="laporan.html">&#128202; Laporan</a>
</div>

<h1>&#128230; Peminjaman Buku</h1>

<div class="row">
  <div class="col">
    <div class="card">
      <h2 style="font-size:16px;margin-bottom:12px;">Pinjam Buku Baru</h2>
      <label for="user-id">ID User</label>
      <input type="number" id="user-id" placeholder="Contoh: 5">
      <label for="book-id">ID Buku</label>
      <input type="number" id="book-id" placeholder="Contoh: 3">
      <button type="button" onclick="pinjamBuku()">&#128230; Pinjam</button>
      <div id="pinjam-result"></div>
    </div>
  </div>
  <div class="col">
    <div class="card">
      <h2 style="font-size:16px;margin-bottom:12px;">Cek Riwayat</h2>
      <label for="cek-user-id">ID User</label>
      <input type="number" id="cek-user-id" placeholder="Contoh: 5">
      <button type="button" onclick="riwayat()">&#128269; Cari</button>
    </div>
  </div>
</div>

<div id="riwayat-area" class="card" style="display:none;">
  <h2 style="font-size:16px;margin-bottom:12px;">Riwayat Peminjaman</h2>
  <div id="riwayat-content" class="loading">Memuat...</div>
</div>

<script>
async function pinjamBuku() {
  const idUser = parseInt(document.getElementById('user-id').value);
  const idBuku = parseInt(document.getElementById('book-id').value);
  const resultEl = document.getElementById('pinjam-result');

  if (!idUser || !idBuku) { resultEl.innerHTML = '<div class="result-box error">Isi ID User dan ID Buku!</div>'; return; }

  resultEl.innerHTML = '<p class="loading">Memproses...</p>';

  try {
    const res = await fetch('../api/peminjaman.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id_user: idUser, id_buku: idBuku })
    });
    const json = await res.json();
    if (json.status === 'sukses') {
      resultEl.innerHTML = `<div class="result-box sukses">${json.data.hasil}</div>`;
    } else {
      resultEl.innerHTML = `<div class="result-box error">${json.error}</div>`;
    }
  } catch(e) {
    resultEl.innerHTML = `<div class="result-box error">${e.message}</div>`;
  }
}

async function riwayat() {
  const idUser = parseInt(document.getElementById('cek-user-id').value);
  if (!idUser) { alert('Isi ID User!'); return; }

  const area = document.getElementById('riwayat-area');
  const content = document.getElementById('riwayat-content');
  area.style.display = 'block';
  content.innerHTML = '<p class="loading">Memuat...</p>';

  try {
    const res = await fetch(`../api/peminjaman.php?id_user=${idUser}`);
    const json = await res.json();
    if (json.status !== 'sukses') { content.innerHTML = `<div class="error">${json.error}</div>`; return; }

    const data = json.data;
    if (data.length === 0) { content.innerHTML = '<p>Tidak ada riwayat peminjaman.</p>'; return; }

    let html = '<table><thead><tr><th>#</th><th>Judul Buku</th><th>Tgl Pinjam</th><th>Batas</th><th>Kembali</th><th>Status</th><th>Denda</th><th>Status Denda</th></tr></thead><tbody>';
    data.forEach((r, i) => {
      const statusBadge = r.status === 'Kembali' ? 'badge-green' : r.status === 'Terlambat' ? 'badge-red' : 'badge-blue';
      html += `<tr>
        <td>${r.id}</td>
        <td>${r.judul_buku}</td>
        <td>${r.borrow_date}</td>
        <td>${r.due_date || '-'}</td>
        <td>${r.return_date || '-'}</td>
        <td><span class="badge ${statusBadge}">${r.status}</span></td>
        <td>${r.denda > 0 ? 'Rp' + parseFloat(r.denda).toLocaleString() : '-'}</td>
        <td>${r.status_denda || '-'}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = `<div class="error">${e.message}</div>`;
  }
}
</script>
</body>
</html>
