<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perpustakaan Digital - Test API</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
body { background: #f5f7fa; padding: 20px; color: #333; }
h1 { font-size: 22px; margin-bottom: 20px; }
.nav { background: #2c3e50; padding: 12px 20px; border-radius: 8px; margin-bottom: 24px; display: flex; gap: 16px; }
.nav a { color: #fff; text-decoration: none; font-weight: 500; padding: 4px 0; border-bottom: 2px solid transparent; }
.nav a:hover { border-color: #fff; }
.card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #f8f9fa; font-weight: 600; color: #555; }
tr:hover { background: #f8f9fa; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.badge-blue { background: #e3f2fd; color: #1565c0; }
.badge-green { background: #e8f5e9; color: #2e7d32; }
.badge-orange { background: #fff3e0; color: #e65100; }
.loading { text-align: center; padding: 40px; color: #888; }
.error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 6px; }
.detail-box { background: #f8f9fa; border-radius: 6px; padding: 16px; margin-top: 12px; }
.detail-box h3 { margin-bottom: 8px; color: #2c3e50; }
</style>
</head>
<body>

<div class="nav">
  <a href="index.html">&#128218; Buku</a>
  <a href="pinjam.html">&#128230; Peminjaman</a>
  <a href="denda.html">&#128176; Denda</a>
  <a href="laporan.html">&#128202; Laporan</a>
</div>

<h1>&#128218; Daftar Buku</h1>
<div id="buku-list" class="card loading">Memuat data...</div>

<div id="detail-area" style="display:none;">
  <h2>Detail Buku</h2>
  <div id="buku-detail" class="card">...</div>
</div>

<script>
async function loadBuku() {
  const el = document.getElementById('buku-list');
  try {
    const res = await fetch('../api/buku.php');
    const json = await res.json();
    if (json.status !== 'sukses') { el.innerHTML = `<div class="error">Error: ${json.error}</div>`; return; }

    const data = json.data;
    if (data.length === 0) { el.innerHTML = '<p>Tidak ada buku.</p>'; return; }

    let html = '<table><thead><tr><th>Judul</th><th>Penerbit</th><th>Rating</th><th>Dipinjam</th><th></th></tr></thead><tbody>';
    data.forEach(b => {
      html += `<tr>
        <td><strong>${b.title}</strong><br><small>ISBN: ${b.isbn}</small></td>
        <td>${b.publisher_name || '-'}</td>
        <td><span class="badge badge-blue">${b.avg_rating || '0.00'}</span></td>
        <td>${b.total_dipinjam}x</td>
        <td><button type="button" onclick="detailBuku(${b.id})" style="padding:4px 12px;cursor:pointer;">Detail</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="error">Gagal fetch API: ${e.message}</div>`;
  }
}

async function detailBuku(id) {
  const area = document.getElementById('detail-area');
  const el = document.getElementById('buku-detail');
  area.style.display = 'block';
  el.innerHTML = '<p class="loading">Memuat detail...</p>';

  try {
    const res = await fetch(`../api/buku.php?id=${id}`);
    const json = await res.json();
    if (json.status !== 'sukses') { el.innerHTML = `<div class="error">${json.error}</div>`; return; }

    const b = json.data;
    el.innerHTML = `<div class="detail-box">
      <h3>${b.title}</h3>
      <table>
        <tr><td style="width:140px;font-weight:600;">ISBN</td><td>${b.isbn}</td></tr>
        <tr><td style="font-weight:600;">Penerbit</td><td>${b.publisher_name || '-'}</td></tr>
        <tr><td style="font-weight:600;">Tahun</td><td>${b.publication_year || '-'}</td></tr>
        <tr><td style="font-weight:600;">Halaman</td><td>${b.total_pages || '-'}</td></tr>
        <tr><td style="font-weight:600;">Penulis</td><td>${b.authors || '-'}</td></tr>
        <tr><td style="font-weight:600;">Kategori</td><td>${b.categories || '-'}</td></tr>
        <tr><td style="font-weight:600;">Rating</td><td><span class="badge badge-blue">${b.avg_rating}</span></td></tr>
      </table>
      <p style="margin-top:8px;"><em>${b.synopsis || 'Tidak ada sinopsis'}</em></p>
    </div>`;
  } catch(e) {
    el.innerHTML = `<div class="error">${e.message}</div>`;
  }
}

loadBuku();
</script>
</body>
</html>
